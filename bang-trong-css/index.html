<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng trong CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">THỰC HÀNH HTML &amp; CSS</p>
            <h1>Bảng trong CSS</h1>
            <p>Định dạng bảng bằng viền, màu sắc, kích thước, căn chỉnh và khoảng cách.</p>
        </header>

        <section class="table-card" aria-labelledby="students-title">
            <h2 id="students-title">Danh sách học viên</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Họ tên</th>
                            <th scope="col">Tuổi</th>
                            <th scope="col">Lớp</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Nguyễn Văn A</td>
                            <td>20</td>
                            <td>Web</td>
                        </tr>
                        <tr>
                            <td>Trần Thị B</td>
                            <td>21</td>
                            <td>Web</td>
                        </tr>
                        <tr>
                            <td>Lê Minh C</td>
                            <td>19</td>
                            <td>Web</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
