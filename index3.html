<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            margin: 32px;
            color: #263442;
            font-family: Arial, sans-serif;
        }
        h1 { color: #174a7e; }
        table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            border: 1px solid #9eacb8;
            text-align: left;
        }
        th { background: #eaf1f6; }
        tbody tr:nth-child(even) { background: #f7f9fb; }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Tên sản phẩm</th>
                <th scope="col">Giá</th>
                <th scope="col">Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bàn phím</td>
                <td>450.000 ₫</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chuột không dây</td>
                <td>320.000 ₫</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Tai nghe</td>
                <td>690.000 ₫</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Màn hình</td>
                <td>3.500.000 ₫</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
