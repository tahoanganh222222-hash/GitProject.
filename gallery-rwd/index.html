<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gallery ảnh responsive với Media Queries.">
    <title>Gallery Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">BỘ SƯU TẬP HÌNH ẢNH</p>
            <h1>Khoảnh khắc thiên nhiên</h1>
            <p>Một gallery đơn giản tự điều chỉnh theo kích thước màn hình.</p>
        </header>

        <section class="gallery" aria-label="Thư viện ảnh thiên nhiên">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Dãy núi và thung lũng dưới bầu trời rộng" loading="lazy">
                <figcaption><span>01</span> Đường chân trời</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Hồ nước yên bình giữa núi rừng" loading="lazy">
                <figcaption><span>02</span> Sớm bên hồ</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Hồ xanh và những ngọn núi phủ cây" loading="lazy">
                <figcaption><span>03</span> Màu xanh bất tận</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80" alt="Động vật hoang dã trong khu rừng" loading="lazy">
                <figcaption><span>04</span> Trong rừng sâu</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Ánh nắng xuyên qua tán cây trong rừng" loading="lazy">
                <figcaption><span>05</span> Lối nhỏ trong rừng</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Những đỉnh núi cao dưới nền trời trong" loading="lazy">
                <figcaption><span>06</span> Chạm tới mây</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80" alt="Cảnh sa mạc rộng lớn lúc hoàng hôn" loading="lazy">
                <figcaption><span>07</span> Nắng trên miền cát</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Ánh bình minh rọi qua những ngọn đồi" loading="lazy">
                <figcaption><span>08</span> Bình minh mới</figcaption>
            </figure>
        </section>

        <footer class="page-footer"><span>GALLERY RESPONSIVE</span><span>Ảnh tải từ Unsplash · Bài thực hành Media Queries</span></footer>
    </main>
</body>
</html>
