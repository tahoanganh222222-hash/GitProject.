<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        body {
            margin: 32px;
            color: #263442;
            font-family: Arial, sans-serif;
        }
        h1 { color: #174a7e; }
        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #9eacb8;
            text-align: left;
        }
        thead { background: #eaf1f6; }
        tbody tr:nth-child(even) { background: #f7f9fb; }
        td[rowspan], td[colspan] { background: #f0f6fa; }
    </style>
</head>
<body>
    <h1>Lịch họp công ty</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Ngày</th>
                <th colspan="2" scope="colgroup">Giờ</th>
                <th rowspan="2" scope="col">Nội dung cuộc họp</th>
            </tr>
            <tr>
                <th scope="col">Khung giờ 1</th>
                <th scope="col">Khung giờ 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Thứ Hai, 19/10/2026</td>
                <td>09:00–10:00</td>
                <td>10:00–11:00</td>
                <td>Họp kế hoạch tuần</td>
            </tr>
            <tr>
                <td colspan="2">13:00–15:00</td>
                <td>Họp dự án (kéo dài 2 giờ)</td>
            </tr>
            <tr>
                <td>Thứ Ba, 20/10/2026</td>
                <td>09:00–10:00</td>
                <td></td>
                <td>Họp nhóm thiết kế</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
