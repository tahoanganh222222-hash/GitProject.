  <text x="240" y="545" text-anchor="middle" fill="#28382c" font-family="Georgia,serif" font-size="40">Dưới tán cây</text>
  <text x="240" y="594" text-anchor="middle" fill="#536548" font-family="Georgia,serif" font-style="italic" font-size="36">kể chuyện</text>
  <text x="240" y="633" text-anchor="middle" fill="#8c846e" font-family="Arial,sans-serif" font-size="11" letter-spacing="4">NHỮNG TRANG VIẾT VỀ BÌNH YÊN</text>
