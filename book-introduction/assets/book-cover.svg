    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#748762"/><stop offset="1" stop-color="#405a45"/></linearGradient>
  </defs>
  <rect width="480" height="680" rx="4" fill="url(#paper)"/>
  <rect x="18" y="18" width="444" height="644" rx="2" fill="none" stroke="#a99b78" stroke-width="2"/>
  <circle cx="337" cy="220" r="73" fill="#d6a761"/>
