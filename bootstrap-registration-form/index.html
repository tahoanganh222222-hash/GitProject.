<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form đăng ký người dùng được xây dựng với Bootstrap Forms.">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">
                <section class="registration-card">
                    <div class="form-heading text-center">
                        <span class="brand-mark" aria-hidden="true">✦</span>
                        <p class="eyebrow mt-3 mb-2">THAM GIA CỘNG ĐỒNG</p>
                        <h1 class="h2 fw-bold">Tạo tài khoản</h1>
                        <p class="text-muted mb-0">Điền thông tin bên dưới để bắt đầu trải nghiệm.</p>
                    </div>

                    <form action="#" method="get" class="registration-form">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nguyễn Văn An" autocomplete="name" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="ban@example.com" autocomplete="email" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" minlength="8" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="confirm-password" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirm-password" name="confirm_password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" minlength="8" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <fieldset>
                                    <legend class="form-label mb-2">Giới tính</legend>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="gender-male" value="male" required><label class="form-check-label" for="gender-male">Nam</label></div>
                                        <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="gender-female" value="female"><label class="form-check-label" for="gender-female">Nữ</label></div>
                                        <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="gender-other" value="other"><label class="form-check-label" for="gender-other">Khác</label></div>
                                    </div>
                                </fieldset>
                            </div>
                            <div class="col-12 col-md-6">
                                <fieldset>
                                    <legend class="form-label mb-2">Sở thích</legend>
                                    <div class="d-flex flex-wrap gap-3">
                                        <div class="form-check"><input class="form-check-input" type="checkbox" name="hobbies[]" id="hobby-tech" value="technology"><label class="form-check-label" for="hobby-tech">Công nghệ</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" name="hobbies[]" id="hobby-travel" value="travel"><label class="form-check-label" for="hobby-travel">Du lịch</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" name="hobbies[]" id="hobby-reading" value="reading"><label class="form-check-label" for="hobby-reading">Đọc sách</label></div>
                                    </div>
                                </fieldset>
                            </div>

                            <div class="col-12">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" name="country" required>
                                    <option value="" selected disabled>Chọn quốc gia của bạn</option>
                                    <option value="vn">Việt Nam</option>
                                    <option value="us">Hoa Kỳ</option>
                                    <option value="jp">Nhật Bản</option>
                                    <option value="kr">Hàn Quốc</option>
                                    <option value="other">Quốc gia khác</option>
                                </select>
                            </div>

                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2">Đăng ký tài khoản</button>
                            </div>
                        </div>
                    </form>
                    <p class="form-note text-center text-muted mb-0">Bằng cách đăng ký, bạn đồng ý với các điều khoản sử dụng.</p>
                </section>
                <p class="page-caption text-center text-muted mt-3 mb-0">Bài thực hành Bootstrap Forms · Responsive trên desktop và mobile</p>
            </div>
        </div>
    </main>
</body>
</html>
