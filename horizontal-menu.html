<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu ngang Dropdown</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f3f5f7;
            color: #293744;
            font-family: Arial, Helvetica, sans-serif;
        }

        #menu {
            min-height: 52px;
            border-bottom: 3px solid #b52b2b;
            background-color: #222;
        }

        #menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        #menu > ul {
            display: flex;
            flex-wrap: wrap;
        }

        #menu li { position: relative; }

        #menu a {
            display: block;
            min-width: 130px;
            height: 49px;
            padding: 0 18px;
            color: #fff;
            line-height: 49px;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
        }

        #menu a:hover,
        #menu a:focus-visible,
        #menu li:hover > a,
        #menu li:focus-within > a {
            background-color: #c62828;
            outline: none;
        }

        #menu ul ul {
            position: absolute;
            top: 49px;
            left: 0;
            z-index: 5;
            min-width: 170px;
            border-top: 3px solid #c62828;
            background-color: #222;
            visibility: hidden;
            opacity: 0;
            transition: opacity .15s ease;
        }

        #menu ul ul a {
            min-width: 170px;
            height: 42px;
            line-height: 42px;
            text-align: left;
        }

        #menu li:hover > ul,
        #menu li:focus-within > ul {
            visibility: visible;
            opacity: 1;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .content-card {
            padding: 24px;
            border: 1px solid #d9e1e7;
            border-radius: 10px;
            background: #fff;
        }

        h1 { margin-top: 0; color: #254e68; }
        p { line-height: 1.65; }

        @media (max-width: 520px) {
            #menu > ul { flex-direction: column; }
            #menu a { text-align: left; }
            #menu ul ul { top: 0; left: 100%; }
        }
    </style>
</head>
<body>
    <nav id="menu" aria-label="Menu chính">
        <ul>
            <li><a href="#home">Trang chủ</a></li>
            <li>
                <a href="#courses">Khóa học ▾</a>
                <ul>
                    <li><a href="#html-css">HTML &amp; CSS</a></li>
                    <li><a href="#javascript">JavaScript</a></li>
                    <li><a href="#python">Python</a></li>
                </ul>
            </li>
            <li>
                <a href="#resources">Tài nguyên ▾</a>
                <ul>
                    <li><a href="#guides">Hướng dẫn</a></li>
                    <li><a href="#projects">Dự án mẫu</a></li>
                </ul>
            </li>
            <li><a href="#about">Giới thiệu</a></li>
            <li><a href="#contact">Liên hệ</a></li>
        </ul>
    </nav>

    <main>
        <section class="content-card" id="home">
            <h1>Menu ngang Dropdown</h1>
            <p>Rê con trỏ lên “Khóa học” hoặc “Tài nguyên” để mở menu con. Bạn cũng có thể dùng phím Tab để điều hướng.</p>
        </section>
    </main>
</body>
</html>
